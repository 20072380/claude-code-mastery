<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1e1f26; font-family: "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .calc { width: 320px; background: #2a2c36; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .display { background: #14151a; border-radius: 12px; padding: 14px 16px; text-align: right; margin-bottom: 16px; min-height: 90px; }
  .history { color: #7c8094; font-size: 14px; min-height: 20px; word-break: break-all; }
  .value { color: #fff; font-size: 40px; margin-top: 8px; overflow-x: auto; white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    height: 60px; border: 0; border-radius: 12px; font-size: 20px; cursor: pointer;
    background: #3a3d4a; color: #fff; transition: transform .05s, filter .15s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.95); }
  .op { background: #ff9f43; }
  .fn { background: #565a6b; }
  .eq { background: #10ac84; grid-column: span 2; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="sign">±</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="dot">.</button>
    <button class="fn" data-action="back">⌫</button>

    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
  const valueEl = document.getElementById('value');
  const historyEl = document.getElementById('history');
  const SYMBOL = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    if (op === '+') r = a + b;
    else if (op === '-') r = a - b;
    else if (op === '*') r = a * b;
    else if (op === '/') { if (b === 0) return '0으로 나눌 수 없음'; r = a / b; }
    return String(parseFloat(r.toPrecision(12)));
  }

  function render() {
    valueEl.textContent = current;
    historyEl.textContent = operator ? `${previous} ${SYMBOL[operator]}` : '';
  }

  function isError() { return isNaN(parseFloat(current)); }

  function inputNumber(n) {
    if (isError() || justEvaluated) { current = n; justEvaluated = false; }
    else current = current === '0' ? n : current + n;
  }

  function inputDot() {
    if (isError() || justEvaluated) { current = '0.'; justEvaluated = false; }
    else if (!current.includes('.')) current += '.';
  }

  function chooseOperator(op) {
    if (isError()) return;
    if (operator && !justEvaluated && previous !== null) {
      current = compute(previous, current, operator);
      if (isError()) { operator = null; previous = null; return; }
    }
    previous = current;
    operator = op;
    justEvaluated = true;   // 다음 숫자 입력 시 새 숫자로 시작
  }

  function equals() {
    if (operator === null || isError()) return;
    historyEl.textContent = `${previous} ${SYMBOL[operator]} ${current} =`;
    current = compute(previous, current, operator);
    operator = null; previous = null;
    justEvaluated = true;
    valueEl.textContent = current;
  }

  function handle(action) {
    if (action === 'clear') { current = '0'; previous = null; operator = null; justEvaluated = false; }
    else if (action === 'sign' && !isError()) current = String(-parseFloat(current));
    else if (action === 'percent' && !isError()) current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    else if (action === 'dot') inputDot();
    else if (action === 'back') {
      if (isError() || justEvaluated) return;
      current = current.length > 1 ? current.slice(0, -1) : '0';
      if (current === '-') current = '0';
    }
    else if (action === 'equals') { equals(); return; }
    render();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) { inputNumber(b.dataset.num); render(); }
    else if (b.dataset.op) { chooseOperator(b.dataset.op); render(); }
    else if (b.dataset.action) handle(b.dataset.action);
  });

  // 키보드 지원
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') { inputNumber(e.key); render(); }
    else if ('+-*/'.includes(e.key)) { chooseOperator(e.key); render(); }
    else if (e.key === '.') handle('dot');
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); handle('equals'); }
    else if (e.key === 'Backspace') handle('back');
    else if (e.key === 'Escape') handle('clear');
    else if (e.key === '%') handle('percent');
  });

  render();
</script>
</body>
</html>
